# The test printers' own hardware_names.cfg: the roles of a printer with a heated chamber (see
# klipper_sim.default_state and printer.cfg). The simulator and the real-firmware runs include
# it after the package, as a printer includes its own, and other repositories reuse it.
[gcode_macro _HARDWARE_VARS]
variable_chamber_heater: "chamber"
variable_chamber_sensor: "heater_generic chamber"
variable_exhaust_fan: "exhaust_fan"
variable_bed_fans: "bed_fans"
variable_external_pc: "external_pc"
variable_motion_sensor: "motion_sensor"
variable_switch_sensor: "switch_sensor"
variable_led_neopixels: ["discostick", "th_leds"]
variable_led_pins: ["daystick"]
