# Test-only assertion macros for the real-Klipper batch scripts. Each macro
# raises (so klippy exits non-zero) when the printer state does not match.

[gcode_macro ASSERT_VAR]
description: Fail unless a macro variable equals VALUE (compared as text)
gcode:
  {% set actual = printer['gcode_macro ' ~ params.MACRO][params.VARIABLE|lower] %}
  {% if actual|string != params.VALUE %}
    {action_raise_error("%s.%s is %s, expected %s" % (params.MACRO, params.VARIABLE, actual, params.VALUE))}
  {% endif %}

[gcode_macro ASSERT_HEATER]
description: Fail unless a heater target equals TARGET (write spaces in HEATER as :)
gcode:
  {% set actual = printer[params.HEATER|replace(':', ' ')].target %}
  {% if (actual - params.TARGET|float)|abs > 0.001 %}
    {action_raise_error("%s target is %s, expected %s" % (params.HEATER|replace(":", " "), actual, params.TARGET))}
  {% endif %}
