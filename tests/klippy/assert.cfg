# Test-only assertion macros for the real-Klipper batch scripts. Each macro
# raises (so klippy exits non-zero) when the printer state does not match.

[gcode_macro ASSERT_VAR]
description: Fail unless a macro variable equals VALUE (compared as text)
gcode:
  {% set actual = printer['gcode_macro ' ~ params.MACRO][params.VARIABLE|lower] %}
  {% if actual|string != params.VALUE %}
    {action_raise_error("%s.%s is %s, expected %s" % (params.MACRO, params.VARIABLE, actual, params.VALUE))}
  {% endif %}

[gcode_macro ASSERT_HEATER]
description: Fail unless a heater target equals TARGET (write spaces in HEATER as :)
gcode:
  {% set actual = printer[params.HEATER|replace(':', ' ')].target %}
  {% if (actual - params.TARGET|float)|abs > 0.001 %}
    {action_raise_error("%s target is %s, expected %s" % (params.HEATER|replace(":", " "), actual, params.TARGET))}
  {% endif %}

[gcode_macro ASSERT_STATUS]
description: Fail unless a status field equals VALUE (write spaces in OBJECT as :)
gcode:
  {% set object = params.OBJECT|replace(':', ' ') %}
  {% set actual = printer[object][params.FIELD] %}
  {% if actual is number and actual is not sameas true and actual is not sameas false %}
    {% set same = (actual - params.VALUE|float)|abs <= 0.01 %}
  {% else %}
    {% set same = actual|string == params.VALUE %}
  {% endif %}
  {% if not same %}
    {action_raise_error("%s.%s is %s, expected %s" % (object, params.FIELD, actual, params.VALUE))}
  {% endif %}

# Batch mode never reports a fan's speed back, because the speed only reaches the status when the
# MCU flushes. These wrappers record the last speed the macros asked for instead, which is what
# the macros decide. The fan variables sit in SET_FAN_SPEED, the part fan's in M106; -1 means no
# command yet. A fan that has no variable is not recorded.
[gcode_macro SET_FAN_SPEED]
description: Record the speed asked of a fan, then set it
rename_existing: BASE_SET_FAN_SPEED
variable_speed_bed_fans: -1
variable_speed_exhaust_fan: -1
variable_speed_external_pc: -1
gcode:
  {% set variable = 'speed_' ~ params.FAN|lower %}
  {% if variable in printer["gcode_macro SET_FAN_SPEED"] %}
    SET_GCODE_VARIABLE MACRO=SET_FAN_SPEED VARIABLE={variable} VALUE={params.SPEED|float}
  {% endif %}
  BASE_SET_FAN_SPEED {rawparams}

[gcode_macro M106]
description: Record the part fan speed asked for, then set it
rename_existing: BASE_M106
variable_speed: -1
gcode:
  SET_GCODE_VARIABLE MACRO=M106 VARIABLE=speed VALUE={params.S|default(255)|float / 255}
  BASE_M106 {rawparams}

[gcode_macro ASSERT_FAN]
description: Fail unless the last speed asked of a fan is SPEED (FAN is a fan_generic name or part)
gcode:
  {% if params.FAN|lower == 'part' %}
    {% set actual = printer["gcode_macro M106"].speed %}
  {% else %}
    {% set actual = printer["gcode_macro SET_FAN_SPEED"]['speed_' ~ params.FAN|lower] %}
  {% endif %}
  {% if (actual - params.SPEED|float)|abs > 0.01 %}
    {action_raise_error("%s was asked for %s, expected %s" % (params.FAN, actual, params.SPEED))}
  {% endif %}
