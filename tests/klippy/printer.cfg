# Test printer for real-Klipper batch runs (linux process MCU pins).
# Mirrors Turbo's device names so the default _HARDWARE_VARS apply.
[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[extruder]
step_pin: gpiochip0/gpio20
dir_pin: gpiochip0/gpio21
enable_pin: !gpiochip0/gpio22
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: gpiochip0/gpio23
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog2
control: watermark
min_temp: 0
max_temp: 300

[heater_bed]
heater_pin: gpiochip0/gpio1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog0
control: watermark
min_temp: 0
max_temp: 130

[heater_generic chamber]
heater_pin: gpiochip0/gpio2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog1
control: watermark
min_temp: 0
max_temp: 80

[fan]
pin: gpiochip0/gpio3

[heater_fan hotend_fan]
pin: gpiochip0/gpio8

[fan_generic exhaust_fan]
pin: gpiochip0/gpio4

[fan_generic external_pc]
pin: gpiochip0/gpio5

[output_pin daystick]
pin: gpiochip0/gpio6
pwm: True

[neopixel discostick]
pin: gpiochip0/gpio9

[filament_switch_sensor switch_sensor]
switch_pin: gpiochip0/gpio7

[filament_motion_sensor motion_sensor]
switch_pin: gpiochip0/gpio10
detection_length: 7
extruder: extruder

[respond]
[pause_resume]
[display_status]

[idle_timeout]
timeout: 4800

[include Klipper-Hardware-Controls/hardware.cfg]
[include Klipper-Hardware-Controls/optional/fan_tach_monitor.cfg]
[include klippy-support/assert.cfg]
