# Included by Hardware Controls' own real-firmware runs only, after the test printer: RESPOND
# counts the warnings and errors that macros send, then responds.
[gcode_macro RESPOND]
description: Count the warnings and errors sent, then respond
rename_existing: BASE_RESPOND
variable_warnings: 0
variable_errors: 0
gcode:
  {% if '⚠' in rawparams %}
    SET_GCODE_VARIABLE MACRO=RESPOND VARIABLE=warnings VALUE={printer["gcode_macro RESPOND"].warnings + 1}
  {% endif %}
  {% if '❌' in rawparams %}
    SET_GCODE_VARIABLE MACRO=RESPOND VARIABLE=errors VALUE={printer["gcode_macro RESPOND"].errors + 1}
  {% endif %}
  BASE_RESPOND {rawparams}
