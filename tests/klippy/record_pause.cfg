# Included by Hardware Controls' own real-firmware runs only, after the test printer: PAUSE
# records what the fan stoppage routine has set when it calls PAUSE, then pauses.
[gcode_macro PAUSE]
description: Record the hotend state at the moment of the pause, then pause
rename_existing: BASE_PAUSE
variable_target: -1
variable_hotend_target: -1
gcode:
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=target VALUE={printer["gcode_macro _HOTEND_FAN_STATE"].target|float}
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=hotend_target VALUE={printer.extruder.target|float}
  BASE_PAUSE {rawparams}
