# Device roles used by every Hardware Controls module and by chamber cooldown.
# Every role that depends on a printer's own devices is off until the printer names its
# device. Include this once before the selected modules, then include your own copy of this
# file outside this checkout. Keep only the roles your printer sets in the copy: Klipper
# merges the two sections and the later value wins.
#
# Naming: generic fans, the chamber heater, sensors, LEDs and steppers take the
# name after the section type ("exhaust_fan" for [fan_generic exhaust_fan]).
# chamber_sensor, bed_heater and part_fan take the full object name. An empty
# string ("") or list ([]) disables a role; missing devices are skipped.
[gcode_macro _HARDWARE_VARS]
# [heater_generic NAME] driven by CHAMBER and the cooldown hold/ramp
variable_chamber_heater: ""
# Full object read when there is no chamber heater, e.g. "temperature_sensor chamber"
variable_chamber_sensor: ""
# Full object name of the bed heater
variable_bed_heater: "heater_bed"
# [fan_generic NAME] for EXHAUST_FAN, BED_FANS and EXTERNAL_PC
variable_exhaust_fan: ""
variable_bed_fans: ""
variable_external_pc: ""
# Part cooling: "fan" for [fan] (uses M106) or "fan_generic NAME"
variable_part_fan: "fan"
# [heater_fan NAME] watched by the optional optional/fan_tach_monitor.cfg
variable_hotend_fan: "hotend_fan"
# [filament_motion_sensor NAME] and [filament_switch_sensor NAME]
variable_motion_sensor: ""
variable_switch_sensor: ""
# [neopixel NAME] and [output_pin NAME] groups for LED_ON / LED_DIM / LED_OFF
variable_led_neopixels: []
variable_led_pins: []
# LED_DIM levels for neopixels and output pins
variable_led_dim: 0.3
variable_led_pin_dim: 0.3
# Stepper sections disabled by RELEASE_XY
variable_release_xy_steppers: ["stepper_x", "stepper_y"]
gcode:
