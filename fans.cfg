[gcode_macro EXHAUST_FAN]
description: Set configured exhaust_fan speed (0.0 to 1.0)
gcode:
  _HARDWARE_FAN ROLE=exhaust_fan SPEED={params.SPEED|default(0.0)}

[gcode_macro BED_FANS]
description: Set configured bed_fans speed (0.0 to 1.0)
gcode:
  _HARDWARE_FAN ROLE=bed_fans SPEED={params.SPEED|default(0.0)}

[gcode_macro EXTERNAL_PC]
description: Set configured external_pc speed (0.0 to 1.0)
gcode:
  _HARDWARE_FAN ROLE=external_pc SPEED={params.SPEED|default(0.0)}

[gcode_macro PART_COOLING]
description: Set part cooling speed (0.0 to 1.0, or 1.1 to 100 percent)
gcode:
  {% set hw = printer["gcode_macro _HARDWARE_VARS"] %}
  {% set object = hw.part_fan %}
  {% set value = params.SPEED|default(0.0)|float(-1) %}
  {% if value >= 0 and value <= 1 %}
    {% set speed = value %}
  {% elif value >= 1.1 and value <= 100 %}
    {% set speed = value / 100 %}
  {% else %}
    {% set speed = 0 %}
    {% set got = params.SPEED|replace('"', "'") %}
    RESPOND PREFIX="⚠️" MSG="Invalid PART_COOLING value {got}, set to 0"
  {% endif %}
  {% if object and object in printer %}
    # No minimum here: the fan's own min_power or off_below decides what a small speed does.
    {% if object == 'fan' %}
      M106 S{(speed * 255)|round|int}
    {% elif object.startswith('fan_generic ') %}
      SET_FAN_SPEED FAN={object[12:]} SPEED={speed}
    {% endif %}
  {% endif %}

[gcode_macro RESET_FANS]
description: Stop the part fan and every other configured fan
gcode:
  PART_COOLING SPEED=0
  EXTERNAL_PC SPEED=0
  BED_FANS SPEED=0
  EXHAUST_FAN SPEED=0

[gcode_macro _HARDWARE_FAN]
gcode:
  {% set hw = printer["gcode_macro _HARDWARE_VARS"] %}
  {% set name = hw[params.ROLE] %}
  {% set object = 'fan_generic ' ~ name %}
  # Non-numeric input becomes -1 so it fails the range check instead of stopping the fan.
  # nan fails every comparison, so it is tested against itself.
  {% set speed = params.SPEED|float(-1) %}
  {% if name and object in printer %}
    {% if speed < 0 or speed > 1 or speed != speed %}
      # Reported, not raised: a raised error is prefixed "Error evaluating" and printed
      # once per macro level, and would abort the print that sent the typo.
      {% set got = params.SPEED|replace('"', "'") %}
      RESPOND PREFIX="❌" MSG="Fan speed must be between 0.0 and 1.0 (got {got})"
    {% else %}
      SET_FAN_SPEED FAN={name} SPEED={speed}
    {% endif %}
  {% endif %}
