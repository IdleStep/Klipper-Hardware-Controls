[gcode_macro EXHAUST_FAN]
description: Set configured exhaust_fan speed (0.0 to 1.0)
gcode:
  _HARDWARE_FAN ROLE=exhaust_fan SPEED={params.SPEED|default(0.0)}

[gcode_macro BED_FANS]
description: Set configured bed_fans speed (0.0 to 1.0)
gcode:
  _HARDWARE_FAN ROLE=bed_fans SPEED={params.SPEED|default(0.0)}

[gcode_macro EXTERNAL_PC]
description: Set configured external_pc speed (0.0 to 1.0)
gcode:
  _HARDWARE_FAN ROLE=external_pc SPEED={params.SPEED|default(0.0)}

[gcode_macro _HARDWARE_FAN]
gcode:
  {% set hw = printer["gcode_macro _HARDWARE_VARS"] %}
  {% set name = hw[params.ROLE] %}
  {% set object = 'fan_generic ' ~ name %}
  {% set speed = params.SPEED|float %}
  {% if name and object in printer %}
    {% if speed < 0 or speed > 1 %}
      {action_raise_error("Fan speed must be between 0.0 and 1.0")}
    {% endif %}
    SET_FAN_SPEED FAN={name} SPEED={speed}
  {% endif %}

[gcode_macro PART_COOLING]
description: Set part cooling speed (0.0 to 1.0, or 1.1 to 100 percent)
gcode:
  {% set hw = printer["gcode_macro _HARDWARE_VARS"] %}
  {% set object = hw.part_fan %}
  {% set raw = params.SPEED|default(0)|float %}
  {% set speed = raw / 100 if raw >= 1.1 and raw <= 100 else (raw if raw >= 0 and raw <= 1 else 0) %}
  {% if object and object in printer %}
    {% set cfg = printer.configfile.settings[object] %}
    {% set minimum = cfg.min_power|default(cfg.off_below|default(0.01))|float %}
    {% set speed = 0 if speed < minimum else speed %}
    {% if object == 'fan' %}
      M106 S{(speed * 255)|round|int}
    {% elif object.startswith('fan_generic ') %}
      SET_FAN_SPEED FAN={object[12:]} SPEED={speed}
    {% endif %}
  {% endif %}

[gcode_macro RESET_FANS]
gcode:
  PART_COOLING SPEED=0
  EXTERNAL_PC SPEED=0
  BED_FANS SPEED=0
  EXHAUST_FAN SPEED=0
