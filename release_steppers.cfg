# Stock Klipper's M84 Z disables all motors, so RELEASE_Z does the same.
# Nothing here runs from the bundle by itself.
[gcode_macro RELEASE_Z]
description: M84 Z (stock Klipper disables ALL motors)
gcode:
  M84 Z

[gcode_macro RELEASE_XY]
description: Disable configured XY steppers individually
gcode:
  {% for name in printer["gcode_macro _HARDWARE_VARS"].release_xy_steppers %}
    {% if name in printer.configfile.settings %}
      SET_STEPPER_ENABLE STEPPER={name} ENABLE=0
    {% endif %}
  {% endfor %}
