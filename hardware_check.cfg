# Run HARDWARE_CHECK by hand after naming your devices in hardware_names.cfg. It reports,
# for every role of _HARDWARE_VARS, which device it finds, and changes nothing. Nothing in
# this package calls it, so a printer stays silent about a name that matches nothing until
# you ask.
[gcode_macro HARDWARE_CHECK]
description: Report which device each hardware role finds and which names match nothing
gcode:
  {% set hw = printer["gcode_macro _HARDWARE_VARS"] %}
  # Each role, the section type that comes before its name and whether it takes several devices
  # (true) or one (false). Keep this in step with the two groups in hardware_names.cfg. A role
  # that holds the full object name has no section type.
  {% set roles = [
    ['chamber_heater', 'heater_generic ', true],
    ['chamber_sensor', '', false],
    ['bed_heater', '', false],
    ['exhaust_fan', 'fan_generic ', true],
    ['bed_fans', 'fan_generic ', true],
    ['external_pc', 'fan_generic ', true],
    ['part_fan', '', false],
    ['hotend_fan', 'heater_fan ', false],
    ['motion_sensor', 'filament_motion_sensor ', false],
    ['switch_sensor', 'filament_switch_sensor ', false],
    ['led_neopixels', 'neopixel ', true],
    ['led_pins', 'output_pin ', true],
    ['release_xy_steppers', '', true]] %}
  # The hotend_fan role only matters to the optional fan monitor.
  {% set monitor = 'gcode_macro HOTEND_FAN_CHECK' in printer %}
  {% set count = namespace(problems=0) %}
  {% for role, section, several in roles %}
    {% set value = hw[role] %}
    # A comma-separated string is several names only for a role that takes several.
    {% set value = value.split(',') if value is string and several else value %}
    {% set names = ([value] if value is string else value)|map('trim')|reject('equalto', '')|list %}
    {% if role == 'hotend_fan' and names and not monitor %}
      RESPOND PREFIX="📃" MSG="{role} - not used, the fan monitor is not included"
      {% set names = [] %}
    {% elif not names %}
      RESPOND PREFIX="📃" MSG="{role} - off"
    {% endif %}
    {% for name in names %}
      {% set object = section ~ name %}
      # Steppers are not printer objects, so they are looked up in the loaded configuration.
      {% set known = printer.configfile.settings if role == 'release_xy_steppers' else printer %}
      {% if section and name.startswith(section) %}
        {% set count.problems = count.problems + 1 %}
        RESPOND PREFIX="⚠️" MSG="{role} - {name} starts with the section type, give only the name after it"
      {% elif object in known %}
        RESPOND PREFIX="📃" MSG="{role} - {object} found"
      {% else %}
        {% set count.problems = count.problems + 1 %}
        RESPOND PREFIX="⚠️" MSG="{role} - {object} not found"
      {% endif %}
    {% endfor %}
  {% endfor %}
  {% set role_names = roles|map('first')|list %}
  {% for key in hw %}
    {% if key not in role_names %}
      {% set count.problems = count.problems + 1 %}
      RESPOND PREFIX="⚠️" MSG="{key} is not a role - misspelt or removed"
    {% endif %}
  {% endfor %}
  {% if count.problems %}
    RESPOND PREFIX="⚠️" MSG="Hardware check found {count.problems} to fix"
  {% else %}
    RESPOND PREFIX="📃" MSG="Hardware check found nothing to fix"
  {% endif %}
