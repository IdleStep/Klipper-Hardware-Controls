[gcode_macro CHAMBER]
description: Set configured chamber heater target
gcode:
  {% set hw = printer["gcode_macro _HARDWARE_VARS"] %}
  {% set temp = params.TEMP|default(0.0)|float(-1) %}
  {% if temp < 0 or temp != temp %}
    # Off is the safe outcome for a heater; reported so a typo is not silent.
    # nan fails every comparison, so it is tested against itself.
    {% set temp = 0.0 %}
    {% set got = params.TEMP|replace('"', "'") %}
    RESPOND PREFIX="⚠️" MSG="Invalid CHAMBER value {got}, set to 0"
  {% endif %}
  # chamber_heater takes several devices: a name, a comma-separated string or a list. Every
  # heater gets the same target, and a name that matches no heater is skipped.
  {% set value = hw.chamber_heater %}
  {% set names = (value if value is not string else value.split(','))
      |map('trim')|reject('equalto', '')|list %}
  {% for name in names if ('heater_generic ' ~ name) in printer %}
    SET_HEATER_TEMPERATURE HEATER={name} TARGET={temp}
  {% endfor %}
