[gcode_macro CHAMBER]
description: Set configured chamber heater target
gcode:
  {% set hw = printer["gcode_macro _HARDWARE_VARS"] %}
  {% set temp = params.TEMP|default(0.0)|float(-1) %}
  {% if temp < 0 or temp != temp %}
    # Off is the safe outcome for a heater; reported so a typo is not silent.
    # nan fails every comparison, so it is tested against itself.
    {% set temp = 0.0 %}
    {% set got = params.TEMP|replace('"', "'") %}
    RESPOND PREFIX="⚠️" MSG="Invalid CHAMBER value {got}, set to 0"
  {% endif %}
  {% if hw.chamber_heater and ('heater_generic ' ~ hw.chamber_heater) in printer %}
    SET_HEATER_TEMPERATURE HEATER={hw.chamber_heater} TARGET={temp}
  {% endif %}
