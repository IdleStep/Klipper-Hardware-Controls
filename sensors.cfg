[gcode_macro MOTION_SENSOR]
description: Enable or disable configured filament motion sensor
# fmotion_enabled and fswitch_enabled are not read here: PAUSE macros save the
# sensor state in them and RESUME macros restore it.
variable_fmotion_enabled: 0
gcode:
  {% set name = printer["gcode_macro _HARDWARE_VARS"].motion_sensor %}
  {% set enable = params.ENABLE|default(1)|float(-1) %}
  {% if enable != 0 and enable != 1 %}
    # Anything but 0 or 1 leaves the sensor as it is, so a typo cannot disable runout detection.
    {% set got = params.ENABLE|replace('"', "'") %}
    RESPOND PREFIX="❌" MSG="MOTION_SENSOR ENABLE must be 0 or 1 (got {got})"
  {% elif name and ('filament_motion_sensor ' ~ name) in printer %}
    SET_FILAMENT_SENSOR SENSOR={name} ENABLE={enable|int}
  {% endif %}

[gcode_macro SWITCH_SENSOR]
description: Enable or disable configured filament switch sensor
variable_fswitch_enabled: 0
gcode:
  {% set name = printer["gcode_macro _HARDWARE_VARS"].switch_sensor %}
  {% set enable = params.ENABLE|default(1)|float(-1) %}
  {% if enable != 0 and enable != 1 %}
    # Anything but 0 or 1 leaves the sensor as it is, so a typo cannot disable runout detection.
    {% set got = params.ENABLE|replace('"', "'") %}
    RESPOND PREFIX="❌" MSG="SWITCH_SENSOR ENABLE must be 0 or 1 (got {got})"
  {% elif name and ('filament_switch_sensor ' ~ name) in printer %}
    SET_FILAMENT_SENSOR SENSOR={name} ENABLE={enable|int}
  {% endif %}

[delayed_gcode ENABLE_MOTION_SENSOR]
gcode:
  MOTION_SENSOR ENABLE=1
