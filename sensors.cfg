[gcode_macro MOTION_SENSOR]
description: Enable or disable configured filament motion sensor
variable_fmotion_enabled: 0
gcode:
  {% set name = printer["gcode_macro _HARDWARE_VARS"].motion_sensor %}
  {% if name and ('filament_motion_sensor ' ~ name) in printer %}
    SET_FILAMENT_SENSOR SENSOR={name} ENABLE={params.ENABLE|default(1)|int}
  {% endif %}

[gcode_macro SWITCH_SENSOR]
description: Enable or disable configured filament switch sensor
variable_fswitch_enabled: 0
gcode:
  {% set name = printer["gcode_macro _HARDWARE_VARS"].switch_sensor %}
  {% if name and ('filament_switch_sensor ' ~ name) in printer %}
    SET_FILAMENT_SENSOR SENSOR={name} ENABLE={params.ENABLE|default(1)|int}
  {% endif %}

[delayed_gcode ENABLE_MOTION_SENSOR]
gcode:
  MOTION_SENSOR ENABLE=1
