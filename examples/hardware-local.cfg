# Copy this file outside the repository, name it hardware-local.cfg and include it after
# hardware.cfg (or settings.cfg). Set the name of each device the printer has and delete
# the lines for the roles it does not have: settings.cfg leaves those off.
# The roles and their meaning are documented in settings.cfg.
[gcode_macro _HARDWARE_VARS]
variable_chamber_heater: "chamber"
variable_chamber_sensor: "heater_generic chamber"
variable_bed_heater: "heater_bed"
variable_exhaust_fan: "exhaust_fan"
variable_bed_fans: "bed_fans"
variable_external_pc: "external_pc"
variable_part_fan: "fan"
variable_motion_sensor: "motion_sensor"
variable_switch_sensor: "switch_sensor"
variable_led_neopixels: ["chamber_leds"]
variable_led_pins: ["work_light"]
variable_led_dim: 0.3
variable_led_pin_dim: 0.3
variable_release_xy_steppers: ["stepper_x", "stepper_y"]
