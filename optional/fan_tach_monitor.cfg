# Hotend fan tachometer monitor: pauses the print and turns the hotend off when the hotend
# fan stops while the hotend is hot.
#
# Needs [heater_fan hotend_fan] (or the fan named by the hotend_fan role of _HARDWARE_VARS)
# with a tachometer_pin, which means a 3-wire fan. The tach wire can go to a spare endstop
# pin and needs a pullup, for example tachometer_pin: ^P1.29
# (https://www.klipper3d.org/Config_Reference.html#heater_fan). The idea comes from the fan
# tach monitor in Andrew Ellis's Print-Tuning-Guide.
#
# The check is skipped when the fan is missing, reports no RPM (no tachometer_pin) or when
# min_rpm is not set, so a misconfigured fan never reads as stopped; it says so once on the
# console. Set min_rpm, and change max_consecutive_stops or check_seconds if you want, as
# variables of HOTEND_FAN_CHECK in a file included after this one. docs/FAN_MONITOR.md says
# how to measure min_rpm.

# Monitoring loop. Begins one second after Klipper starts.
[delayed_gcode HOTEND_FAN_MONITOR]
initial_duration: 1
gcode:
  # Re-armed before the check: Klipper ends a timer whose gcode raised an error unless the
  # gcode has already scheduled the next run, and the monitor would stop for good.
  UPDATE_DELAYED_GCODE ID=HOTEND_FAN_MONITOR DURATION={printer["gcode_macro HOTEND_FAN_CHECK"].check_seconds|int}
  HOTEND_FAN_CHECK

[gcode_macro HOTEND_FAN_CHECK]
description: Pause and turn off the hotend if the hotend fan stops
variable_check_seconds: 3
variable_max_consecutive_stops: 3
variable_min_rpm: 0
gcode:
  {% set hw = printer["gcode_macro _HARDWARE_VARS"] %}
  {% set tach = printer["gcode_macro HOTEND_FAN_CHECK"] %}
  {% set state = printer["gcode_macro _HOTEND_FAN_STATE"] %}
  {% set fan_object = 'heater_fan ' ~ hw.hotend_fan %}
  {% if fan_object not in printer or printer[fan_object].rpm is none or tach.min_rpm|float <= 0 %}
    # Said once, not every check: a safety monitor that watches nothing must not be silent.
    {% if not state.warned %}
      SET_GCODE_VARIABLE MACRO=_HOTEND_FAN_STATE VARIABLE=warned VALUE=True
      {% if fan_object not in printer %}
        RESPOND PREFIX="⚠️" MSG="Hotend fan is not monitored - no {fan_object} exists. Set hotend_fan in your hardware_names.cfg."
      {% elif printer[fan_object].rpm is none %}
        RESPOND PREFIX="⚠️" MSG="Hotend fan is not monitored - {fan_object} has no tachometer_pin."
      {% else %}
        RESPOND PREFIX="⚠️" MSG="Hotend fan is not monitored - min_rpm is not set. Set it for HOTEND_FAN_CHECK as the README describes."
      {% endif %}
    {% endif %}
  {% else %}
    {% set extruder = printer.toolhead.extruder %}
    {% set rpm = printer[fan_object].rpm|float %}
    {% set target = printer[extruder].target|float %}
    {% set temp = printer[extruder].temperature|float %}
    {% set fan_on_temp = printer.configfile.settings[fan_object].heater_temp|float %}
    {% set max_stops = tach.max_consecutive_stops|int %}
    {% if target >= fan_on_temp and temp >= fan_on_temp and rpm < tach.min_rpm|float %}
      {% set stops = state.stops|int + 1 %}
      SET_GCODE_VARIABLE MACRO=_HOTEND_FAN_STATE VARIABLE=stops VALUE={stops}
      RESPOND PREFIX="⚠️" MSG="Hotend fan stopped ({stops}/{max_stops})"
      {% if stops >= max_stops %}
        FAN_STOPPAGE_ROUTINE
      {% endif %}
    {% else %}
      SET_GCODE_VARIABLE MACRO=_HOTEND_FAN_STATE VARIABLE=stops VALUE=0
      # A target left over from a stoppage routine whose PAUSE failed must not make a later
      # pause reheat the hotend.
      SET_GCODE_VARIABLE MACRO=_HOTEND_FAN_STATE VARIABLE=target VALUE=0
    {% endif %}
  {% endif %}

# What HOTEND_FAN_CHECK counts, apart from its settings so that a local file which overrides
# the settings never has to repeat it. target is the hotend target that FAN_STOPPAGE_ROUTINE
# turned off, set only while it runs PAUSE: a PAUSE macro that saves the hotend target for
# RESUME reads it, so the resume heats the hotend again.
[gcode_macro _HOTEND_FAN_STATE]
variable_stops: 0
variable_warned: False
variable_target: 0
gcode:

# Runs every check while the stop conditions hold, until the hotend target drops below the
# fan's on temperature. Put your own G-code here to change what happens.
[gcode_macro FAN_STOPPAGE_ROUTINE]
description: Pause the print and turn off the hotend after a fan stoppage
gcode:
  {% set extruder = printer.toolhead.extruder %}
  # The hotend goes off first, so that a PAUSE macro which fails still leaves it cold. The
  # target it had is kept in _HOTEND_FAN_STATE for the PAUSE macro to save. The hotend goes
  # off when the print was already paused too: a pause alone leaves it hot.
  SET_GCODE_VARIABLE MACRO=_HOTEND_FAN_STATE VARIABLE=target VALUE={printer[extruder].target|float}
  SET_HEATER_TEMPERATURE HEATER={extruder} TARGET=0
  {% if printer.pause_resume.is_paused|int == 0 %}
    M117 Hotend fan stopped
    RESPOND PREFIX="❌" MSG="Hotend fan stopped, pausing the print and turning the hotend off"
    PAUSE
  {% else %}
    RESPOND PREFIX="❌" MSG="Hotend fan stopped, turning the hotend off"
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_HOTEND_FAN_STATE VARIABLE=target VALUE=0
