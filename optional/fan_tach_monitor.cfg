# Hotend fan tachometer monitor: pauses the print and turns the hotend off when the hotend
# fan stops while the hotend is hot.
#
# Needs [heater_fan hotend_fan] with a tachometer_pin, which means a 3-wire fan. The tach
# wire can go to a spare endstop pin and needs a pullup, for example tachometer_pin: ^P1.29
# (https://www.klipper3d.org/Config_Reference.html#heater_fan). The idea comes from the fan
# tach monitor in Andrew Ellis's Print-Tuning-Guide.
#
# The check is skipped when the fan is missing or reports no RPM (no tachometer_pin), so a
# misconfigured fan never reads as stopped. To change min_rpm, max_consecutive_stops or
# check_seconds, override the variables of HOTEND_FAN_CHECK in a file included after this one.

# Monitoring loop. Begins one second after Klipper starts.
[delayed_gcode CHECK_ALL_FANS]
initial_duration: 1
gcode:
  HOTEND_FAN_CHECK
  UPDATE_DELAYED_GCODE ID=CHECK_ALL_FANS DURATION={printer["gcode_macro HOTEND_FAN_CHECK"].check_seconds|int}

[gcode_macro HOTEND_FAN_CHECK]
description: Pause and turn off the hotend if the hotend fan stops
variable_check_seconds: 3
variable_he_stop_count: 0
variable_max_consecutive_stops: 3
variable_min_rpm: 8000
gcode:
  {% set tach = printer["gcode_macro HOTEND_FAN_CHECK"] %}
  {% set fan = 'heater_fan hotend_fan' %}
  {% if fan in printer and printer[fan].rpm is not none %}
    {% set extruder = printer.toolhead.extruder %}
    {% set rpm = printer[fan].rpm|float %}
    {% set target = printer[extruder].target|float %}
    {% set temp = printer[extruder].temperature|float %}
    {% set fan_on_temp = printer.configfile.settings[fan].heater_temp|float %}
    {% set max_stops = tach.max_consecutive_stops|int %}
    {% if target >= fan_on_temp and temp >= fan_on_temp and rpm < tach.min_rpm|float %}
      {% set stops = tach.he_stop_count|int + 1 %}
      SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=he_stop_count VALUE={stops}
      RESPOND PREFIX="⚠️" MSG="Hotend fan stopped ({stops}/{max_stops})"
      {% if stops >= max_stops %}
        FAN_STOPPAGE_ROUTINE
      {% endif %}
    {% else %}
      SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=he_stop_count VALUE=0
    {% endif %}
  {% endif %}

# Runs every check while the stop conditions hold, until the hotend target drops below the
# fan's on temperature. Put your own G-code here to change what happens.
[gcode_macro FAN_STOPPAGE_ROUTINE]
description: Pause the print and turn off the hotend after a fan stoppage
gcode:
  {% set extruder = printer.toolhead.extruder %}
  {% if printer.pause_resume.is_paused|int == 0 %}
    M117 Hotend fan stopped
    RESPOND PREFIX="❌" MSG="Hotend fan stopped, pausing the print and turning the hotend off"
    PAUSE
  {% endif %}
  # The hotend goes off after the pause so that a RESUME macro that reheats to the target
  # saved by PAUSE still can. It goes off when the print was already paused too: a pause
  # alone leaves it hot. Turn it back on before resuming.
  SET_HEATER_TEMPERATURE HEATER={extruder} TARGET=0
