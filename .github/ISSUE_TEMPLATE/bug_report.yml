name: Bug report
description: A command does the wrong thing, prints an error, or is missing
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The tag or commit you run, and whether it is Klipper or Kalico
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      description: For example `PART_COOLING SPEED=abc`, with the output it printed
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Your hardware-local.cfg
      description: Only the part that sets `_HARDWARE_VARS`. Remove anything private.
