name: Hardware template checks
on:
  push:
    branches: [main]
  pull_request:

# The tests only read the repository.
permissions:
  contents: read

# A new push to a pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v

  # Load the package in real firmware (no hardware) and run tests/klippy/*.gcode.
  # Klipper pins Jinja2 2.11, Kalico (Turbo's firmware) 3.1: both must pass.
  klippy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - firmware: klipper
            repository: Klipper3d/klipper
            ref: a08fc79fcfa342e5b95ac02a9a8b271f453523e9
          - firmware: kalico
            repository: KalicoCrew/kalico
            ref: a6796621ef8abb905935a5b5c194a523a1d45a48
    name: klippy (${{ matrix.firmware }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: .firmware
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build linux process MCU dictionary
        run: |
          cp .firmware/test/configs/linuxprocess.config .firmware/.config
          make -C .firmware olddefconfig
          make -C .firmware -j4
      - name: Install requirements
        run: |
          pip install -r requirements-test.txt
          python -m venv .klippy-env
          .klippy-env/bin/pip install -r .firmware/scripts/klippy-requirements.txt
      - run: python -m unittest discover -s tests -p test_klippy.py -v
        env:
          KLIPPER_DIR: .firmware
          KLIPPY_DICT: .firmware/out/klipper.dict
          KLIPPY_PYTHON: .klippy-env/bin/python
          KLIPPY_REQUIRED: '1'
