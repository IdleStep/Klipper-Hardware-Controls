name: Release

# A tag named vMAJOR.MINOR.PATCH publishes a GitHub Release whose notes are that version's
# section of CHANGELOG.md. To publish the Release of an older tag, run it by hand from the
# Actions tab with the tag name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v1.2.0
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # The only job that writes: it creates the Release.
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Take the notes from the changelog
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a tag named vMAJOR.MINOR.PATCH"
            exit 1
          fi
          awk -v heading="## [${TAG#v}]" '
            /^## / { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
            found
          ' CHANGELOG.md | grep -v '^\[.*\]: https' > notes.md || true
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi
      - name: Create the release
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
