[gcode_macro DUMP_FAN]
description: Print configured part fan status
gcode:
  {% set name = printer["gcode_macro _HARDWARE_VARS"].part_fan %}
  {% if name and name in printer %}
    {% for parameter, value in printer[name].items()|sort %}
      {action_respond_info("printer.%s.%s = %s" % (name, parameter, value))}
    {% endfor %}
  {% endif %}
