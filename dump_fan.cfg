[gcode_macro DUMP_FAN]
description: Print configured part fan status
gcode:
  # part_fan takes one device. A comma in it is not a separator.
  {% set object = printer["gcode_macro _HARDWARE_VARS"].part_fan %}
  {% if object and object in printer %}
    {% for parameter, value in printer[object].items()|sort %}
      {action_respond_info("printer.%s.%s = %s" % (object, parameter, value))}
    {% endfor %}
  {% endif %}
