[gcode_macro LED_OFF]
description: Turn configured LEDs off
gcode:
  _HARDWARE_LED LEVEL=0 PIN_LEVEL=0

[gcode_macro LED_ON]
description: Turn configured LEDs on at full brightness
gcode:
  _HARDWARE_LED LEVEL=1 PIN_LEVEL=1

[gcode_macro LED_DIM]
description: Set configured LEDs to dim levels
# Brightness, 0 to 1, of the neopixels and of the output pins. Set them in the printer's own
# LED file, which is included after this one.
variable_neopixel_level: 0.33
variable_pin_level: 0.33
gcode:
  {% set dim = printer["gcode_macro LED_DIM"] %}
  _HARDWARE_LED LEVEL={dim.neopixel_level} PIN_LEVEL={dim.pin_level}

[gcode_macro _HARDWARE_LED]
gcode:
  {% set hw = printer["gcode_macro _HARDWARE_VARS"] %}
  # led_neopixels and led_pins take several devices: a name, a comma-separated string or a list.
  # A string must be split here: looping over it would visit one letter at a time.
  {% set neopixels = (hw.led_neopixels if hw.led_neopixels is not string
                      else hw.led_neopixels.split(','))
      |map('trim')|reject('equalto', '')|list %}
  {% set pins = (hw.led_pins if hw.led_pins is not string else hw.led_pins.split(','))
      |map('trim')|reject('equalto', '')|list %}
  {% for name in neopixels %}
    {% if ('neopixel ' ~ name) in printer %}
      SET_LED LED={name} RED={params.LEVEL} GREEN={params.LEVEL} BLUE={params.LEVEL} SYNC=0 TRANSMIT=1
    {% endif %}
  {% endfor %}
  {% for name in pins %}
    {% set object = 'output_pin ' ~ name %}
    {% if object in printer %}
      # Klipper refuses any value but 0 and 1 for a pin without pwm, and the error would stop
      # the macro that called this. The pin is left as it is and the console says so.
      {% set pwm = (printer.configfile.settings[object]|default({})).pwm|default(true) %}
      {% set level = params.PIN_LEVEL|float %}
      {% if pwm or level == 0 or level == 1 %}
        SET_PIN PIN={name} VALUE={params.PIN_LEVEL}
      {% else %}
        RESPOND PREFIX="⚠️" MSG="LED_DIM leaves {name} unchanged - the output pin has no pwm"
      {% endif %}
    {% endif %}
  {% endfor %}
